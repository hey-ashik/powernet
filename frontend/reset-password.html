<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PowerNet</title>
  <meta name="description" content="Set a new password for PowerNet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i class="fa-brands fa-superpowers" style="font-size: 20px;"></i>
          </div>
          <span class="auth-logo-text">PowerNet</span>
        </div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Create a secure new password for your account</p>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <form id="form-reset">
        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock" style="margin-right: 6px; color: var(--text-secondary);"></i> New Password
          </label>
          <input type="password" id="password" class="input-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">
            <i class="fa-solid fa-shield-halved" style="margin-right: 6px; color: var(--text-secondary);"></i> Confirm New Password
          </label>
          <input type="password" id="confirm_password" class="input-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary-block" style="margin-top: 12px;">
          <i class="fa-solid fa-key" style="margin-right: 8px;"></i> Update Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login"><i class="fa-solid fa-arrow-left" style="margin-right: 4px;"></i> Return to login</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
