<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PowerNet</title>
  <meta name="description" content="Set a new password for PowerNet">
  <meta name="theme-color" content="#1A5AF0">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/favicon.svg">

  <!-- OpenGraph / Social Sharing Link Preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PowerNet">
  <meta property="og:title" content="Reset Password — PowerNet">
  <meta property="og:description" content="Set a new secure password for your PowerNet account.">
  <meta property="og:image" content="/assets/images/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reset Password — PowerNet">
  <meta name="twitter:description" content="Set a new secure password for your PowerNet account.">
  <meta name="twitter:image" content="/assets/images/og-preview.jpg">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-page-container">
    <!-- Left Form Side -->
    <div class="auth-form-side">
      <div class="auth-top-bar">
        <a href="/" class="auth-back-link">
          <i class="fa-solid fa-chevron-left"></i>
          <span>Back to home</span>
        </a>
      </div>

      <div class="auth-form-wrapper">
        <div class="auth-header">
          <h1 class="auth-title">Set New Password</h1>
          <p class="auth-subtitle">Create a secure new password for your account</p>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <form id="form-reset">
          <div class="form-group">
            <label class="form-label" for="password">
              New Password<span class="text-required">*</span>
            </label>
            <div class="input-container">
              <input type="password" id="password" class="input-control" placeholder="Enter new password" minlength="8" required autocomplete="new-password">
              <button type="button" class="input-icon-btn toggle-password" data-target="password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm_password">
              Confirm New Password<span class="text-required">*</span>
            </label>
            <div class="input-container">
              <input type="password" id="confirm_password" class="input-control" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
              <button type="button" class="input-icon-btn toggle-password" data-target="confirm_password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth-primary" style="margin-top: 12px;">
            Update Password
          </button>
        </form>

        <div class="auth-bottom-row">
          <a href="/login" class="auth-link"><i class="fa-solid fa-arrow-left" style="margin-right: 4px;"></i> Return to Sign In</a>
        </div>
      </div>

      <!-- Empty footer spacer -->
      <div style="height: 16px;"></div>
    </div>

    <!-- Right Brand Side (TailAdmin Split-Screen with PowerNet Branding) -->
    <div class="auth-brand-side">
      <div class="auth-grid-shape auth-grid-top">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>
      <div class="auth-grid-shape auth-grid-bottom">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>

      <div class="auth-brand-card">
        <a href="/" class="auth-brand-logo-group">
          <div class="auth-brand-icon">
            <i class="fa-brands fa-superpowers"></i>
          </div>
          <span class="auth-brand-title">PowerNet</span>
        </a>
        <p class="auth-brand-tagline">
          Smart Electrical Energy Monitoring &amp; Predictive Intelligence
        </p>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
