<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PowerNet</title>
  <meta name="description" content="Reset your PowerNet account password">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-page-container">
    <!-- Left Form Side -->
    <div class="auth-form-side">
      <div class="auth-top-bar">
        <a href="/" class="auth-back-link">
          <i class="fa-solid fa-chevron-left"></i>
          <span>Back to home</span>
        </a>
      </div>

      <div class="auth-form-wrapper">
        <div class="auth-header">
          <h1 class="auth-title">Forgot Password?</h1>
          <p class="auth-subtitle">Enter your email and we'll send a secure reset link</p>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <form id="form-forgot">
          <div class="form-group">
            <label class="form-label" for="email">
              Email<span class="text-required">*</span>
            </label>
            <input type="email" id="email" class="input-control" placeholder="info@gmail.com" required autocomplete="email">
          </div>

          <button type="submit" class="btn-auth-primary" style="margin-top: 12px;">
            Send Reset Link
          </button>
        </form>

        <div class="auth-bottom-row">
          Remember your password? <a href="/login" class="auth-link">Sign In</a>
        </div>
      </div>

      <!-- Empty footer spacer -->
      <div style="height: 16px;"></div>
    </div>

    <!-- Right Brand Side (TailAdmin Split-Screen with PowerNet Branding) -->
    <div class="auth-brand-side">
      <div class="auth-grid-shape auth-grid-top">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>
      <div class="auth-grid-shape auth-grid-bottom">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>

      <div class="auth-brand-card">
        <a href="/" class="auth-brand-logo-group">
          <div class="auth-brand-icon">
            <i class="fa-brands fa-superpowers"></i>
          </div>
          <span class="auth-brand-title">PowerNet</span>
        </a>
        <p class="auth-brand-tagline">
          Smart Electrical Energy Monitoring &amp; Predictive Intelligence
        </p>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
