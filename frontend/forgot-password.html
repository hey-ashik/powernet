<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PowerNet</title>
  <meta name="description" content="Reset your PowerNet account password">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i class="fa-brands fa-superpowers" style="font-size: 20px;"></i>
          </div>
          <span class="auth-logo-text">PowerNet</span>
        </div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send a secure reset link</p>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <form id="form-forgot">
        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fa-regular fa-envelope" style="margin-right: 6px; color: var(--text-secondary);"></i> Account Email
          </label>
          <input type="email" id="email" class="input-control" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn-primary-block" style="margin-top: 12px;">
          <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="/login"><i class="fa-solid fa-arrow-left" style="margin-right: 4px;"></i> Return to login</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
