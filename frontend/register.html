<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — PowerNet</title>
  <meta name="description" content="Create a new PowerNet account to monitor electrical energy and AI predictions">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i class="fa-solid fa-bolt-lightning" style="font-size: 20px;"></i>
          </div>
          <span class="auth-logo-text">PowerNet</span>
        </div>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Join the smart electrical energy monitoring platform</p>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <form id="form-register">
        <div class="form-group">
          <label class="form-label" for="name">
            <i class="fa-regular fa-user" style="margin-right: 6px; color: var(--text-secondary);"></i> Full Name
          </label>
          <input type="text" id="name" class="input-control" placeholder="e.g. Ashik Islam" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fa-regular fa-envelope" style="margin-right: 6px; color: var(--text-secondary);"></i> Email
          </label>
          <input type="email" id="email" class="input-control" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock" style="margin-right: 6px; color: var(--text-secondary);"></i> Password (min 8 chars)
          </label>
          <input type="password" id="password" class="input-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">
            <i class="fa-solid fa-shield-halved" style="margin-right: 6px; color: var(--text-secondary);"></i> Confirm Password
          </label>
          <input type="password" id="confirm_password" class="input-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary-block" style="margin-top: 10px;">
          <i class="fa-solid fa-user-plus" style="margin-right: 8px;"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
