<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — PowerNet</title>
  <meta name="description" content="Create your PowerNet account to monitor electrical energy and AI predictions">
  <meta name="theme-color" content="#1A5AF0">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/favicon.svg">

  <!-- OpenGraph / Social Sharing Link Preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PowerNet">
  <meta property="og:title" content="Sign Up — PowerNet">
  <meta property="og:description" content="Create your PowerNet account to monitor electrical energy and AI predictions.">
  <meta property="og:image" content="/assets/images/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign Up — PowerNet">
  <meta name="twitter:description" content="Create your PowerNet account to monitor electrical energy and AI predictions.">
  <meta name="twitter:image" content="/assets/images/og-preview.jpg">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-page-container">
    <!-- Left Form Side -->
    <div class="auth-form-side">
      <div class="auth-top-bar">
        <a href="/" class="auth-back-link">
          <i class="fa-solid fa-chevron-left"></i>
          <span>Back to home</span>
        </a>
      </div>

      <div class="auth-form-wrapper">
        <div class="auth-header">
          <h1 class="auth-title">Sign Up</h1>
          <p class="auth-subtitle">Enter your details to create your account!</p>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <form id="form-register">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="fname">
                First Name<span class="text-required">*</span>
              </label>
              <input type="text" id="fname" class="input-control" placeholder="First name" required autocomplete="given-name">
            </div>
            <div class="form-group">
              <label class="form-label" for="lname">
                Last Name<span class="text-required">*</span>
              </label>
              <input type="text" id="lname" class="input-control" placeholder="Last name" required autocomplete="family-name">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">
              Email<span class="text-required">*</span>
            </label>
            <input type="email" id="email" class="input-control" placeholder="Enter your email" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              Password<span class="text-required">*</span>
            </label>
            <div class="input-container">
              <input type="password" id="password" class="input-control" placeholder="Enter your password" minlength="8" required autocomplete="new-password">
              <button type="button" class="input-icon-btn toggle-password" data-target="password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm_password">
              Confirm Password<span class="text-required">*</span>
            </label>
            <div class="input-container">
              <input type="password" id="confirm_password" class="input-control" placeholder="Confirm your password" minlength="8" required autocomplete="new-password">
              <button type="button" class="input-icon-btn toggle-password" data-target="confirm_password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-top: 10px; margin-bottom: 20px;">
            <label class="form-checkbox-label" style="align-items: flex-start;">
              <input type="checkbox" id="terms" required checked style="margin-top: 2px;">
              <span style="font-size: 13px; line-height: 1.45; color: #475467;">
                By creating an account means you agree to the <strong style="color: #111827;">Terms and Conditions</strong>, and our <strong style="color: #111827;">Privacy Policy</strong>
              </span>
            </label>
          </div>

          <button type="submit" class="btn-auth-primary">
            Sign Up
          </button>
        </form>

        <div class="auth-bottom-row">
          Already have an account? <a href="/login" class="auth-link">Sign In</a>
        </div>
      </div>

      <!-- Empty footer spacer -->
      <div style="height: 16px;"></div>
    </div>

    <!-- Right Brand Side (TailAdmin Split-Screen with PowerNet Branding) -->
    <div class="auth-brand-side">
      <div class="auth-grid-shape auth-grid-top">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>
      <div class="auth-grid-shape auth-grid-bottom">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>

      <div class="auth-brand-card">
        <a href="/" class="auth-brand-logo-group">
          <div class="auth-brand-icon">
            <i class="fa-brands fa-superpowers"></i>
          </div>
          <span class="auth-brand-title">PowerNet</span>
        </a>
        <p class="auth-brand-tagline">
          Smart Electrical Energy Monitoring &amp; Predictive Intelligence
        </p>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
