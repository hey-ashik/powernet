<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices — PowerNet Energy Monitoring</title>
  <meta name="description" content="Manage and pair devices with PowerNet">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <div id="yt-progress-bar"></div>
  <div class="app-container">
    <aside class="sidebar">
      <div>
        <div class="brand-wrapper">
          <a href="/dashboard" class="brand-logo-group">
            <div class="brand-icon">
              <i class="fa-brands fa-superpowers" style="font-size: 20px;"></i>
            </div>
            <div class="brand-text">PowerNet</div>
          </a>
          <button class="sidebar-toggle-btn" id="btn-sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="3" ry="3"/>
              <line x1="9" x2="9" y1="3" y2="21"/>
            </svg>
          </button>
        </div>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="/dashboard" class="nav-link">
              <div class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.5" y="3.5" width="7" height="7" rx="2.2"></rect>
                  <rect x="13.5" y="3.5" width="7" height="7" rx="2.2"></rect>
                  <rect x="3.5" y="13.5" width="7" height="7" rx="2.2"></rect>
                  <rect x="13.5" y="13.5" width="7" height="7" rx="2.2"></rect>
                </svg>
              </div>
              <span class="nav-text">Analytics</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/devices" class="nav-link active">
              <div class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
              </div>
              <span class="nav-text">Devices</span>
            </a>
          </li>
        </ul>
        <div class="sidebar-divider"></div>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#settings" class="nav-link" id="nav-settings" data-tooltip="Settings">
              <div class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </div>
              <span class="nav-text">Settings</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/" class="nav-link" id="btn-logout" data-tooltip="Sign Out" onclick="API.setToken(''); API.setUser(null); window.location.href='/'; return false;">
              <div class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 20a6 6 0 0 0-12 0"></path>
                  <circle cx="12" cy="10" r="4"></circle>
                  <circle cx="12" cy="12" r="10"></circle>
                </svg>
              </div>
              <span class="nav-text">Sign Out</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Support / Hardware Widget (Smooth Skeleton Loading) -->
      <div class="sidebar-widget">
        <div class="widget-skeleton-wrap">
          <div class="widget-skeleton-icon skeleton-shimmer"></div>
          <div class="widget-skeleton-title skeleton-shimmer"></div>
          <div class="widget-skeleton-sub skeleton-shimmer"></div>
          <div class="widget-skeleton-btn skeleton-shimmer"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="page-title-group">
          <h1 class="page-title">Connected Devices</h1>
        </div>
        <div class="top-actions">
          <div class="user-profile" id="user-profile-trigger" title="View Account & Settings">
            <div class="avatar" id="user-avatar-display">--</div>
            <span class="user-name" id="user-name-display">Loading...</span>
          </div>
        </div>
      </header>

      <!-- Connect Device Form Card (Hidden by default, shown only when disconnected) -->
      <div class="card" id="card-connect-device" style="display: none; margin-bottom: 28px; border-radius: 20px; padding: 24px 28px; background: #FFFFFF; border: 1px solid var(--border-card); box-shadow: var(--shadow-card);">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
          <div>
            <h2 style="font-size: 18px; font-weight: 800; color: #0F172A; margin: 0 0 4px 0; display: flex; align-items: center; gap: 10px;">
              <span style="width: 34px; height: 34px; border-radius: 9px; background: #EFF6FF; color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 15px;">
                <i class="fa-solid fa-link"></i>
              </span>
              Connect Device
            </h2>
            <p style="color: #64748B; font-size: 13.5px; margin: 0; line-height: 1.5;">
              Enter your Device ID (e.g. <code>pnw101</code>) to lock it to your account and begin streaming telemetry.
            </p>
          </div>
          <span style="font-size: 12px; background: #F1F5F9; color: #475569; padding: 5px 12px; border-radius: 9999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i> Single Device Lock
          </span>
        </div>

        <form id="form-connect-device-page" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: flex-end;">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="device_id">Device Identifier</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-hashtag input-icon"></i>
              <input type="text" id="device_id" class="input-control" placeholder="e.g. pnw101" required value="pnw101">
            </div>
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="device_name">Device Name (Optional)</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-tag input-icon"></i>
              <input type="text" id="device_name" class="input-control" placeholder="e.g. Main Panel">
            </div>
          </div>
          <button type="submit" class="btn-primary-inline" style="height: 48px; padding: 0 24px;">
            <i class="fa-solid fa-plus"></i> Connect Device
          </button>
        </form>
      </div>

      <!-- Device List -->
      <h2 style="font-size: 17px; font-weight: 700; margin-bottom: 14px; color: #0F172A; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Active Device
      </h2>
      <div id="devices-list">
        <!-- Rendered dynamically by devices.js -->
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/devices.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
