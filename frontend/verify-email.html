<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification — PowerNet</title>
  <meta name="description" content="Verify your PowerNet account email">
  <meta name="theme-color" content="#1A5AF0">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/favicon.svg">

  <!-- OpenGraph / Social Sharing Link Preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PowerNet">
  <meta property="og:title" content="Email Verification — PowerNet">
  <meta property="og:description" content="Verify your PowerNet account email to activate security and device monitoring.">
  <meta property="og:image" content="/assets/images/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Email Verification — PowerNet">
  <meta name="twitter:description" content="Verify your PowerNet account email to activate security and device monitoring.">
  <meta name="twitter:image" content="/assets/images/og-preview.jpg">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="auth-page-container">
    <!-- Left Form Side -->
    <div class="auth-form-side">
      <div class="auth-top-bar">
        <a href="/" class="auth-back-link">
          <i class="fa-solid fa-chevron-left"></i>
          <span>Back to home</span>
        </a>
      </div>

      <div class="auth-form-wrapper" style="text-align: center;">
        <div class="auth-header">
          <h1 class="auth-title" id="verif-title">Verifying your email...</h1>
          <p class="auth-subtitle" id="verif-desc">Please wait while we confirm your account.</p>
        </div>

        <div id="verif-status-box" style="margin: 24px 0; font-size: 40px; color: var(--auth-brand-primary);">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <a href="/login?verified=1" class="btn-auth-primary" id="btn-to-login" style="display: none; text-decoration: none; margin-top: 16px;">
          <i class="fa-solid fa-right-to-bracket" style="margin-right: 6px;"></i> Continue to Sign In
        </a>
      </div>

      <!-- Empty footer spacer -->
      <div style="height: 16px;"></div>
    </div>

    <!-- Right Brand Side (TailAdmin Split-Screen with PowerNet Branding) -->
    <div class="auth-brand-side">
      <div class="auth-grid-shape auth-grid-top">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>
      <div class="auth-grid-shape auth-grid-bottom">
        <img src="/assets/images/shape/grid-01.svg" alt="grid pattern">
      </div>

      <div class="auth-brand-card">
        <a href="/" class="auth-brand-logo-group">
          <div class="auth-brand-icon">
            <i class="fa-brands fa-superpowers"></i>
          </div>
          <span class="auth-brand-title">PowerNet</span>
        </a>
        <p class="auth-brand-tagline">
          Smart Electrical Energy Monitoring &amp; Predictive Intelligence
        </p>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const title = document.getElementById('verif-title');
      const desc = document.getElementById('verif-desc');
      const icon = document.getElementById('verif-status-box');
      const alertBox = document.getElementById('alert-box');
      const btn = document.getElementById('btn-to-login');

      if (!token) {
        title.textContent = 'Verification Link Missing';
        desc.textContent = 'No verification token was found in the URL link.';
        icon.innerHTML = '<i class="fa-solid fa-circle-xmark" style="color: #DC2626;"></i>';
        alertBox.className = 'alert-box alert-error';
        alertBox.textContent = 'Token missing or invalid.';
        alertBox.style.display = 'block';
        btn.style.display = 'inline-flex';
        return;
      }

      try {
        const res = await API.request(`/auth/verify-email.php?token=${encodeURIComponent(token)}`);
        title.textContent = 'Email Verified!';
        desc.textContent = 'Your account is active. Redirecting to sign in...';
        icon.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16A34A;"></i>';
        if (alertBox) alertBox.style.display = 'none';
        btn.style.display = 'inline-flex';

        setTimeout(() => {
          window.location.href = '/login?verified=1';
        }, 1200);
      } catch (err) {
        title.textContent = 'Verification Failed';
        desc.textContent = err.message || 'This link may have expired or already been used.';
        icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #F59E0B;"></i>';
        alertBox.className = 'alert-box alert-error';
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        btn.style.display = 'inline-flex';
      }
    });
  </script>
</body>
</html>
