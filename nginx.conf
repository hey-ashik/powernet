# ==========================================================
# PowerNet Nginx Virtual Host Configuration
# Domain: powernet.ashik.com
# ==========================================================

server {
    listen 80;
    listen [::]:80;
    server_name powernet.ashik.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name powernet.ashik.com;

    root /var/www/powernet;
    index frontend/dashboard.html frontend/index.html;

    # SSL Certificates (Configure with your Let's Encrypt certificates)
    # ssl_certificate /etc/letsencrypt/live/powernet.ashik.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/powernet.ashik.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Clean URLs for Public and Authenticated Pages
    location = / {
        try_files /frontend/index.html =404;
    }

    location = /register {
        try_files /frontend/register.html =404;
    }

    location = /login {
        try_files /frontend/login.html =404;
    }

    location = /dashboard {
        try_files /frontend/dashboard.html =404;
    }

    location = /devices {
        try_files /frontend/devices.html =404;
    }

    location = /analytics {
        try_files /frontend/analytics.html =404;
    }

    location = /verify-email {
        try_files /frontend/verify-email.html =404;
    }

    location = /forgot-password {
        try_files /frontend/forgot-password.html =404;
    }

    location = /reset-password {
        try_files /frontend/reset-password.html =404;
    }

    # Clean API Routing (/api/...) -> maps to backend/api/*.php
    location /api/ {
        rewrite ^/api/(.*)$ /backend/api/$1.php last;
    }

    # Assets & Static files
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # PHP-FPM Processor for Backend APIs
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
    }
    location ~ /\.git {
        deny all;
    }
    location ~ /database/ {
        deny all;
    }
}
